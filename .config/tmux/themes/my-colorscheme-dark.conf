# Theme: my-colorscheme (dark)
# Source palette: ~/personal/my-colorscheme/lua/my-colorscheme/palettes/dark.lua
#
# A theme file sets @t_* tokens and the tmux-agents @agents-color-* options
# only. No styles, no formats, no keybindings; tmux.conf and the plugin own
# those and read the tokens, so theme files stay interchangeable. Tokens left
# out keep the defaults declared in tmux.conf (plugin colours: its own).

# Foreground scale
set -g @t_fg_strong   "#cccca5"   # emphasised text: message text, busy agents
set -g @t_fg          "#999982"   # baseline text: status line, plain windows
set -g @t_fg_muted    "#808079"   # receded text: idle agents

# Backgrounds
set -g @t_bg          "default"   # status line background (terminal default)
set -g @t_bg_raised   "#002333"   # raised surfaces: message-command prompt
set -g @t_bg_highlight "#233f4c"  # highlighted row: menu selection

# Semantic accents
set -g @t_focus       "#cc5f29"   # where you are: current window, prefix indicator, display-panes
set -g @t_attention   "#5ca8cc"   # needs you: unread agents (popup glyph)
set -g @t_active      "#caa944"   # in progress: busy agents
set -g @t_info        "#5ca8cc"   # neutral hint: zoom icon, display-panes active
set -g @t_ok          "#78ba8d"   # calm / fine: clock, idle agents
set -g @t_danger      "#e94969"   # blocked: agents waiting for an answer

# Borders
set -g @t_border        "#00344d" # inactive pane border
set -g @t_border_active "#999982" # active pane border

# Brand
set -g @t_brand_claude "#d97757"  # Claude popup / menu border

# tmux-agents (~/personal/tmux-agents). Option values are literal text, so
# these cannot point at the tokens above with #{...}: each line repeats the
# token it mirrors, and the comment names it so the two stay in step.
set -g @agents-color-waiting       "#e94969"   # @t_danger      agent waiting for an answer
set -g @agents-color-attention     "#5ca8cc"   # @t_attention   rang, unread
set -g @agents-color-busy          "#caa944"   # @t_active      working; also the [COPY] flag
set -g @agents-color-idle          "#78ba8d"   # @t_ok          idle
set -g @agents-color-fg            "#999982"   # @t_fg          popup status / sidebar text
set -g @agents-color-fg-strong     "#cccca5"   # @t_fg_strong   current window text
set -g @agents-color-muted         "#808079"   # @t_fg_muted    project labels, +N overflow
set -g @agents-color-bg            "default"   # @t_bg          popup status background
set -g @agents-color-highlight     "#233f4c"   # @t_bg_highlight current window / cursor row
set -g @agents-color-border        "#00344d"   # @t_border      popup inactive pane border
set -g @agents-color-border-active "#999982"   # @t_border_active
set -g @agents-color-brand         "#d97757"   # @t_brand_claude popup border, menus, prefix indicator
