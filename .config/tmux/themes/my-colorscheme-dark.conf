# Theme: my-colorscheme (dark)
# Source palette: ~/personal/my-colorscheme/lua/my-colorscheme/palettes/dark.lua
#
# A theme file sets the @t_* tokens only, every one of them: tmux.conf has no
# defaults, and a token left out leaves the styles that read it without a
# colour. No styles, no formats, no keybindings; tmux.conf owns those (and
# hands the tokens to tmux-agents), so theme files stay interchangeable.

# Foreground scale, as nvim uses the palette: text is the baseline (Normal,
# StatusLine), text_grey the receded (comments, inactive tabs). Emphasis is
# bold on the same colour (nvim's CursorLineNr, TabLineSel), not a brighter
# one: the palette has none. text_sage (#999982) is nvim's secondary text
# (Pmenu items, inlay hints); next to grey it is too close (1.37:1) to tell
# baseline from receded, so tmux does not use it for text.
set -g @t_fg_strong   "#cccca5"   # emphasised text, with bold: current window, message text
set -g @t_fg          "#cccca5"   # baseline text: status line, plain windows, sidebar titles
set -g @t_fg_muted    "#808079"   # receded text: idle agents, labels

# Backgrounds
set -g @t_bg          "default"   # status line background (terminal default)
set -g @t_bg_raised   "#002333"   # raised surfaces: message-command prompt
set -g @t_bg_highlight "#233f4c"  # highlighted row: menu selection
set -g @t_bg_hover    "#2a2a2e"   # the row under the mouse: fainter than highlight

# Semantic accents
set -g @t_focus       "#cc5f29"   # where you are: current window, prefix indicator, display-panes
set -g @t_attention   "#5ca8cc"   # needs you: unread agents (popup glyph)
set -g @t_active      "#caa944"   # in progress: busy agents
set -g @t_info        "#5ca8cc"   # neutral hint: zoom icon, display-panes active
set -g @t_ok          "#78ba8d"   # calm / fine: clock, idle agents
set -g @t_danger      "#e94969"   # blocked: agents waiting for an answer

# Borders
set -g @t_border        "#00344d" # inactive pane border
set -g @t_border_active "#999982" # active pane border

# Brand
set -g @t_brand_claude "#d97757"  # Claude popup / menu border
