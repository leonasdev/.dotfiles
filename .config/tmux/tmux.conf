# ==============================================================================
#  Server Options
# ==============================================================================
set -s escape-time 30          # Resolve delay for the ESC key in Vim/Neovim
set -s focus-events on         # Allow terminal to pass focus events to apps inside tmux

# ==============================================================================
#  Terminal & Colors
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on    # Allow raw escape sequences (like images) to pass through

# Forward extended keys (CSI u) so Shift+Enter etc. reach apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Undercurl & Underscore Colors (Kitty protocol & Windows Terminal support)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ==============================================================================
#  Global Settings
# ==============================================================================
set -g history-limit 100000    # Boost scrollback buffer size
set -g mouse on                # Enable mouse support (scrolling, clicking, resizing)
set -g set-clipboard on        # Allow tmux to interact with the system clipboard
set -ga update-environment "SSH_TTY"    # Refresh SSH_TTY in session env on attach, so nvim can tell SSH vs local clients

set -g base-index 1            # Start window indexing at 1 (instead of 0)
setw -g pane-base-index 1      # Start pane indexing at 1
set -g renumber-windows on     # Re-index windows automatically when one is closed
setw -g automatic-rename on    # Rename window automatically to reflect current program
setw -g monitor-bell off       # Disabled; only Claude Code produces alerts via claude.sh
set -g bell-action none         # Suppress terminal bell from all panes; claude.sh bypasses this directly

set -g set-titles off           # Update the host terminal's title bar
set -g set-titles-string "#T"

# ==============================================================================
#  Key Bindings: Prefix & Core
# ==============================================================================
unbind C-b                     # Unbind default prefix
set -g prefix C-a              # Set prefix to Ctrl-a
bind C-a send-prefix           # Send prefix to inner session (useful for nested tmux/SSH)

# Reload config file and display a message
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# ==============================================================================
#  Key Bindings: Panes
# ==============================================================================
unbind Left
unbind Down
unbind Up
unbind Right

# Pane navigation (Vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (Repeatable)
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Swap panes (Repeatable)
bind -r > swap-pane -D         # Swap current pane with the next one
bind -r < swap-pane -U         # Swap current pane with the previous one

# Split panes (Removed -r to prevent accidental rapid-fire splits)
bind '"' split-window -v -c "#{pane_current_path}"
bind "'" split-window -h -c "#{pane_current_path}"

# Other pane functions
bind m resize-pane -Z          # Maximize/restore current pane

# ==============================================================================
#  Key Bindings: Windows & Sessions
# ==============================================================================
bind C-c new-session                           # Create a new session
bind c   new-window -c "#{pane_current_path}"  # Create a new window (retain current dir)

bind -r C-h previous-window                    # Move to the previous window
bind -r C-l next-window                        # Move to the next window
bind Tab    last-window                        # Move to the last active window

# Swap windows
bind -r C-Left  swap-window -t -1 \; select-window -t -1
bind -r C-Right swap-window -t +1 \; select-window -t +1

# ==============================================================================
#  Key Bindings: Copy Mode
# ==============================================================================
setw -g mode-keys vi           # Use Vim keybindings in copy mode
bind Enter copy-mode           # Press Enter to enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi 'C-q' send -X begin-selection \; send -X rectangle-toggle # Visual block mode
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ==============================================================================
#  Theme
# ==============================================================================
# Colours are never written inline. Every style/format below reads a @t_* token;
# themes/<name>.conf overrides the tokens and themes/current.conf (a symlink)
# picks the active theme. prefix+T switches; theme.sh does the bookkeeping.
#
# Defaults first, so a theme that leaves a token out never breaks a style.
set -g @t_fg_strong     "#cccca5"   # emphasised text
set -g @t_fg            "#999982"   # baseline text
set -g @t_fg_muted      "#808079"   # receded text
set -g @t_bg            "default"   # status background
set -g @t_bg_raised     "#002333"   # raised surfaces (message-command)
set -g @t_bg_highlight  "#233f4c"   # highlighted row (menus)
set -g @t_focus         "#cc5f29"   # where you are
set -g @t_attention     "#5ca8cc"   # needs you
set -g @t_active        "#caa944"   # in progress
set -g @t_info          "#5ca8cc"   # neutral hint
set -g @t_ok            "#78ba8d"   # calm / fine
set -g @t_danger        "#e94969"   # blocked: an agent needs an answer
set -g @t_border        "#00344d"   # inactive pane border
set -g @t_border_active "#999982"   # active pane border
set -g @t_brand_claude  "#d97757"   # Claude popup / menu border

source-file ~/.config/tmux/themes/current.conf
# display-panes-colour, display-panes-active-colour and clock-mode-colour are
# plain colour options and reject formats, so theme.sh copies the tokens in.
run-shell "$HOME/.config/tmux/theme.sh apply"

bind T run-shell "$HOME/.config/tmux/theme.sh menu"

# ==============================================================================
#  UI & Status Line
# ==============================================================================
set -g status-interval 1       # Redraw status line every 1 second
set -g status-justify absolute-centre # Center the window list

# Core styling
set -g status-style "bg=#{@t_bg},fg=#{@t_fg}"
set -g pane-border-style "fg=#{@t_border}"
set -g pane-active-border-style "fg=#{@t_border_active}"
set -g message-style "fg=#{@t_fg_strong}"
set -g message-command-style "bg=#{@t_bg_raised},fg=#{@t_fg_strong}"

# Popups & menus: keep terminal-default background.
# tmux master (next-3.8+) changed these defaults to bg=themedarkgrey, which
# renders popups/menus with a grey fill; release builds (<=3.5a) default to
# transparent. -q suppresses errors on older tmux without these options.
set -gq popup-style "default"
set -gq popup-border-style "default"
set -gq menu-style "default"
set -gq menu-border-style "default"
# display-panes-colour / display-panes-active-colour / clock-mode-colour:
# set by `theme.sh apply` from @t_focus / @t_info / @t_ok (see Theme section).

# Status Left: a label naming the layer ("tmux" here, "agents" in the popup),
# which doubles as the prefix indicator: muted normally, @t_focus while the
# prefix is active. A session name is appended only if it was given one (a
# default numeric name like "0" says nothing and is hidden).
set -g status-left-length 100
set -g status-left " #{?client_prefix,#[fg=#{@t_focus}#,bold],#[fg=#{@t_fg_muted}]}[tmux#{?#{m/r:^[0-9]+$,#S},, #S}] "

# Status Right: copy-mode flag, then user@host, muted. user@host is dropped when
# the window list would otherwise run into it. The list is centred on the whole
# width (status-justify absolute-centre), so it reaches the right label once
# list_width > client_width - 2 * right_label_width. The list width is estimated
# from the entries' text (" index:name " plus the 2-column separator) plus an
# 8-column allowance for agent dots; tmux still trims the list with < > markers
# if it must.
set -g status-right-length 100
set -g @status_squeezed '#{e|>=:#{e|+:#{e|+:#{n:#{W: #I:#W   }},8},#{e|*:2,#{e|+:#{n:#{user}@#h},6}}},#{client_width}}'
# The trailing #() is the agent state feed (agent-state.sh loop); it prints
# nothing visible and only exists so tmux keeps the loop running.
set -g status-right "#{?pane_in_mode,#[fg=#{@t_active}#,bold][COPY] #[default],}#{?#{E:@status_squeezed},,#[fg=#{@t_fg_muted}][#{user}@#h] }#(~/.config/tmux/agent-state.sh loop)"

# Window List Formatting
# Current window = brightest neutral, bold. Position is shown by brightness so
# the state glyphs keep the hues to themselves; @t_focus stays on the prefix
# indicator and display-panes.
setw -g window-status-current-style "fg=#{@t_fg_strong},bg=#{@t_bg_highlight},bold"
setw -g window-status-style "fg=#{@t_fg},bg=#{@t_bg}"
# Project entry: "<dots> <index>:<name> [zoom]". One glyph per agent in the
# window's Claude popup that needs you or is running:
#   ●  @t_danger  waiting for an answer   ●  @t_attention  rang, unread
#   ●  @t_active  busy
# Idle agents are not drawn here (the popup lists everyone), so a quiet project
# is just its name. Capped at 8 glyphs then "+N". agent-state.sh builds the
# string (@agent_dots); claude.sh triggers a tick on every bell/sync so a new
# bell shows at once. The zoom icon is shown on every zoomed window, current or
# not, so both formats are the same width and selecting never shifts the list.
setw -g window-status-current-format ' #{?@agent_dots,#{E:@agent_dots}#[default] ,}#I:#W#{?window_zoomed_flag, #[fg=#{@t_info}]󰊓#[default],} '
setw -g window-status-format ' #{?@agent_dots,#{E:@agent_dots}#[default] ,}#I:#W#{?window_zoomed_flag, #[fg=#{@t_info}]󰊓#[default],} '

# Gap between window entries (main and popup alike). Entries also pad
# themselves by one space on each side so the current window's highlight
# block has some air.
setw -g window-status-separator "  "

# Bell style
set -g window-status-bell-style "fg=#{@t_attention},bg=#{@t_bg},bold"


# ==============================================================================
#  Claude Code Integration
# ==============================================================================

bind space run-shell "$HOME/.config/tmux/claude.sh select '#{window_id}' '#{pane_current_path}'"

# Claude sessions persist when their window dies; orphans surface in the prefix+space picker.
# Run `~/.config/tmux/claude.sh cleanup` manually to purge orphans.

# Override kill-window: warn if the window has an active Claude popup session
bind & run-shell "$HOME/.config/tmux/claude.sh kill-window '#{window_id}'"

# Restart stale Claude processes to apply an update (menu confirms first).
# Busy sessions are listed but left alone.
bind U run-shell "$HOME/.config/tmux/claude.sh restart-all"

# ---- Popup (claude socket) only ----------------------------------------------
# The popup session lives on a second tmux server (socket "claude") that reads
# this same file; everything in this block applies only there.
#
# Window list entry, one per agent:  <glyph> <index>:<title>
#   ●  waiting: Claude reports it needs an answer   @t_danger, bold  (holds until answered)
#   ●  unread bell                                   @t_attention, bold
#   ●  busy                                          @t_active
#   ○  idle, already seen                            @t_ok
#   (no glyph) not a claude  plain window
# Only the glyph carries state colour. The title text has two looks, current
# (@t_focus, bold) and not current (baseline), exactly like the main window list.
# @agent_state is set by agent-state.sh. The title is Claude Code's own
# terminal title (its AI-generated session name, or /rename) with the ✳ prefix
# dropped; windows without one fall back to #W.
#
# The window list wraps onto a second status row after ROW_SPLIT (6) windows;
# agent-state.sh turns the second row on and off per session.
if-shell -F '#{m:*/claude,#{socket_path}}' {
  # Label = the project this popup belongs to (its main-socket window name, kept
  # in the session option @orig_window_name by claude.sh), doubling as the
  # prefix indicator. It is padded with spaces to exactly the width of the
  # sidebar pane plus its border, read live from the pane, and the list is
  # justified "centre" (within what is left, not the whole width): the window
  # list is centred over the agent pane and stays so if the sidebar is resized.
  # No host label and no #() feed here: agent-state.sh runs on the main server.
  set -g status-justify centre
  set -g @sidebar_width '#{P:#{?#{==:#{@sidebar},1},#{pane_width},}}'
  # ...and ends with a │ right under the pane border, so the sidebar's edge
  # continues through the status line.
  # ...and ends with a │ right under the pane border, so the sidebar's edge
  # continues through the status line. Its colour follows the border above it:
  # the border next to the focused pane is drawn active, so it is dim while the
  # sidebar itself has focus (#{@sidebar} here is the active pane's option).
  set -g status-left "#{?client_prefix,#[fg=#{@t_focus}#,bold],#[fg=#{@t_fg_muted}]} [#{@orig_window_name}] #{R: ,#{e|-:#{e|-:#{E:@sidebar_width},4},#{n:@orig_window_name}}}#[fg=#{?#{==:#{@sidebar},1},#{@t_border},#{@t_border_active}}]│"
  set -g status-right "#{?pane_in_mode,#[fg=#{@t_active}#,bold][COPY] ,}"
  # Second status row (7+ agents): same left padding and │, but no label.
  set -g @status_left_blank "#{R: ,#{e|+:#{E:@sidebar_width},1}}#[fg=#{?#{==:#{@sidebar},1},#{@t_border},#{@t_border_active}}]│"
  setw -g window-status-current-format ' #{?@agent_state,#{?#{==:#{@agent_state},waiting},#[fg=#{@t_danger}#,bold]● ,#{?window_bell_flag,#[fg=#{@t_attention}#,bold]● ,#{?#{==:#{@agent_state},busy},#[fg=#{@t_active}]● ,#[fg=#{@t_ok}]○ }}}#[default]#I:#{?#{m:✳ *,#{pane_title}},#{s/^✳ //:pane_title},#W},#I:#W} '
  setw -g window-status-format ' #{?@agent_state,#{?#{==:#{@agent_state},waiting},#[fg=#{@t_danger}#,bold]● ,#{?window_bell_flag,#[fg=#{@t_attention}#,bold]● ,#{?#{==:#{@agent_state},busy},#[fg=#{@t_active}]● ,#[fg=#{@t_ok}]○ }}}#[default]#I:#{?#{m:✳ *,#{pane_title}},#{s/^✳ //:pane_title},#W},#I:#W} '
  # tmux would otherwise recolour the whole entry of a bell window; the glyph carries it.
  setw -g window-status-bell-style default
  set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{e|<=:#{window_index},6},#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},},#{?#{e|<=:#{window_index},6},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}},}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
  set -g 'status-format[1]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{E:@status_left_blank}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{e|>:#{window_index},6},#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},},#{?#{e|>:#{window_index},6},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}},}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
}
