# ==============================================================================
#  Server Options
# ==============================================================================
set -s escape-time 30          # Resolve delay for the ESC key in Vim/Neovim
set -s focus-events on         # Allow terminal to pass focus events to apps inside tmux

# ==============================================================================
#  Terminal & Colors
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on    # Allow raw escape sequences (like images) to pass through

# Forward extended keys (CSI u) so Shift+Enter etc. reach apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Undercurl & Underscore Colors (Kitty protocol & Windows Terminal support)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ==============================================================================
#  Global Settings
# ==============================================================================
set -g history-limit 100000    # Boost scrollback buffer size
set -g mouse on                # Enable mouse support (scrolling, clicking, resizing)
set -g set-clipboard on        # Allow tmux to interact with the system clipboard
set -ga update-environment "SSH_TTY"    # Refresh SSH_TTY in session env on attach, so nvim can tell SSH vs local clients

set -g base-index 1            # Start window indexing at 1 (instead of 0)
setw -g pane-base-index 1      # Start pane indexing at 1
set -g renumber-windows on     # Re-index windows automatically when one is closed
setw -g automatic-rename on    # Rename window automatically to reflect current program
setw -g monitor-bell off       # Disabled here; the agent popup server (tmux-agents) monitors its own
set -g bell-action none         # Suppress terminal bell from all panes; tmux-agents writes agent bells to the client ttys directly

set -g set-titles off           # Update the host terminal's title bar
set -g set-titles-string "#T"

# ==============================================================================
#  Key Bindings: Prefix & Core
# ==============================================================================
unbind C-b                     # Unbind default prefix
set -g prefix C-a              # Set prefix to Ctrl-a
bind C-a send-prefix           # Send prefix to inner session (useful for nested tmux/SSH)

# Reload config file and display a message
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# ==============================================================================
#  Key Bindings: Panes
# ==============================================================================
unbind Left
unbind Down
unbind Up
unbind Right

# Pane navigation (Vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (Repeatable)
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Swap panes (Repeatable)
bind -r > swap-pane -D         # Swap current pane with the next one
bind -r < swap-pane -U         # Swap current pane with the previous one

# Split panes (Removed -r to prevent accidental rapid-fire splits)
bind '"' split-window -v -c "#{pane_current_path}"
bind "'" split-window -h -c "#{pane_current_path}"

# Other pane functions
bind m resize-pane -Z          # Maximize/restore current pane

# ==============================================================================
#  Key Bindings: Windows & Sessions
# ==============================================================================
bind C-c new-session                           # Create a new session
bind c   new-window -c "#{pane_current_path}"  # Create a new window (retain current dir)

bind -r C-h previous-window                    # Move to the previous window
bind -r C-l next-window                        # Move to the next window
bind Tab    last-window                        # Move to the last active window

# Swap windows
bind -r C-Left  swap-window -t -1 \; select-window -t -1
bind -r C-Right swap-window -t +1 \; select-window -t +1

# ==============================================================================
#  Key Bindings: Copy Mode
# ==============================================================================
setw -g mode-keys vi           # Use Vim keybindings in copy mode
bind Enter copy-mode           # Press Enter to enter copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi 'C-q' send -X begin-selection \; send -X rectangle-toggle # Visual block mode
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ==============================================================================
#  Theme
# ==============================================================================
# Colours are never written inline. Every style/format below reads a @t_* token,
# and themes/<name>.conf sets them all (there are no defaults here: the theme
# file is the only place a colour is written). @theme picks the file; to
# switch, change it and reload (prefix+r).
set -g @theme my-colorscheme-dark
# -F expands the path as a format (tmux 3.2+), so #{@theme} names the file.
source-file -F "$HOME/.config/tmux/themes/#{@theme}.conf"
# display-panes-colour, display-panes-active-colour and clock-mode-colour are
# plain colour options and reject formats: -F copies the token's value in now.
set -gF  display-panes-colour        "#{@t_focus}"
set -gF  display-panes-active-colour "#{@t_info}"
set -gwF clock-mode-colour           "#{@t_ok}"

# ==============================================================================
#  UI & Status Line
# ==============================================================================
set -g status-interval 1       # Redraw status line every 1 second
set -g status-justify absolute-centre # Center the window list

# Core styling
set -g status-style "bg=#{@t_bg},fg=#{@t_fg}"
set -g pane-border-style "fg=#{@t_border}"
set -g pane-active-border-style "fg=#{@t_border_active}"
set -g message-style "fg=#{@t_fg_strong}"
set -g message-command-style "bg=#{@t_bg_raised},fg=#{@t_fg_strong}"

# Popups & menus: keep terminal-default background.
# tmux master (next-3.8+) changed these defaults to bg=themedarkgrey, which
# renders popups/menus with a grey fill; release builds (<=3.5a) default to
# transparent. -q suppresses errors on older tmux without these options.
set -gq popup-style "default"
set -gq popup-border-style "default"
set -gq menu-style "default"
set -gq menu-border-style "default"
# display-panes-colour / display-panes-active-colour / clock-mode-colour:
# set from @t_focus / @t_info / @t_ok in the Theme section.

# Status Left: a label naming the layer ("tmux" here, "agents" in the popup),
# which doubles as the prefix indicator: muted normally, @t_focus while the
# prefix is active. A session name is appended only if it was given one (a
# default numeric name like "0" says nothing and is hidden).
set -g status-left-length 100
set -g status-left " #{?client_prefix,#[fg=#{@t_focus}#,bold],#[fg=#{@t_fg_muted}]}[tmux#{?#{m/r:^[0-9]+$,#S},, #S}] "

# Status Right: copy-mode flag, then user@host, muted. user@host is dropped when
# the window list would otherwise run into it. The list is centred on the whole
# width (status-justify absolute-centre), so it reaches the right label once
# list_width > client_width - 2 * right_label_width. The list width is estimated
# from the entries' text (" index:name " plus the 2-column separator) plus an
# 8-column allowance for agent dots; tmux still trims the list with < > markers
# if it must.
set -g status-right-length 100
set -g @status_squeezed '#{e|>=:#{e|+:#{e|+:#{n:#{W: #I:#W   }},8},#{e|*:2,#{e|+:#{n:#{user}@#h},6}}},#{client_width}}'
set -g status-right "#{?pane_in_mode,#[fg=#{@t_active}#,bold][COPY] #[default],}#{?#{E:@status_squeezed},,#[fg=#{@t_fg_muted}][#{user}@#h] }"

# Window List Formatting
# Current window = brightest neutral, bold. Position is shown by brightness so
# the state glyphs keep the hues to themselves; @t_focus stays on the prefix
# indicator and display-panes.
setw -g window-status-current-style "fg=#{@t_fg_strong},bg=#{@t_bg_highlight},bold"
setw -g window-status-style "fg=#{@t_fg_muted},bg=#{@t_bg}"  # receded, as nvim's TabLine
# Window entry: "<index>:<name> [zoom] ". tmux-agents prepends a space and
# its indicator (inject mode, see Agents below), which gives the entry its
# room on the left with or without glyphs: one glyph per agent in the
# window's popup that needs you or is running (waiting @agents-color-waiting,
# unread @agents-color-attention, busy @agents-color-busy; the theme file
# keeps those equal to @t_danger / @t_attention / @t_active), nothing when
# none does. The zoom icon is shown on every zoomed window, current or not,
# so both formats are the same width and selecting never shifts the list.
setw -g window-status-current-format '#I:#W#{?window_zoomed_flag, #[fg=#{@t_info}]󰊓#[default],} '
setw -g window-status-format '#I:#W#{?window_zoomed_flag, #[fg=#{@t_info}]󰊓#[default],} '

# Gap between window entries (main and popup alike). Entries also have a
# space on each side (the right one their own, the left one tmux-agents')
# so the current window's highlight block has some air.
setw -g window-status-separator "  "

# Bell style
set -g window-status-bell-style "fg=#{@t_attention},bg=#{@t_bg},bold"


# ==============================================================================
#  Agents (tmux-agents plugin)
# ==============================================================================
# tmux-agents (the Go version in ~/personal/tmux-agents-go, loaded manually
# rather than through TPM) tracks every Claude Code session in this tmux and
# shows their state in the window formats above: the daemon prepends
# #{E:@agents_indicator} to them in the running server (inject, which the
# default status mode "auto" picks for a status line of one's own), as it
# would for anyone; writing it in the formats would choose its place
# instead. With popup "home" the agents run in a popup on a second tmux
# server (socket "agents", the plugin's default), one session per window of
# this one; the plugin's daemon configures that server itself. It reads
# this file too, where the plugin line only has the daemon put its
# configuration back after a reload.
#
# Colours: the plugin's colour roles take the theme's tokens. The plugin reads
# the option values as literal colours, so -F expands the tokens now.
#
# Keys: prefix+space opens this window's popup (the first time, a picker to
# start a session or adopt an orphan) and hides it from inside; prefix+&
# warns before killing a window that has agents (their session is kept as an
# orphan); prefix+u restarts idle agents after a Claude Code upgrade (the
# plugin binds no key for it by default: the popup's sidebars offer it).
# Inside the popup, prefix+C-j / prefix+C-k go to the next / previous window
# in the sidebar's order, across projects (repeatable, like C-h / C-l, which
# keep tmux's next-window / previous-window within the session).
set -gF @agents-color-waiting       "#{@t_danger}"         # waiting for an answer
set -gF @agents-color-attention     "#{@t_attention}"      # rang, unread
set -gF @agents-color-busy          "#{@t_active}"         # working; also the [COPY] flag
set -gF @agents-color-idle          "#{@t_ok}"
set -gF @agents-color-fg            "#{@t_fg}"             # popup status / sidebar text
set -gF @agents-color-fg-strong     "#{@t_fg_strong}"      # current window text
set -gF @agents-color-muted         "#{@t_fg_muted}"       # project labels, +N overflow
set -gF @agents-color-bg            "#{@t_bg}"             # popup status background
set -gF @agents-color-highlight     "#{@t_bg_highlight}"   # current window / cursor row
set -gF @agents-color-border        "#{@t_border}"         # popup inactive pane border
set -gF @agents-color-border-active "#{@t_border_active}"
set -gF @agents-color-brand         "#{@t_brand_claude}"   # popup border
set -gF @agents-color-focus         "#{@t_focus}"          # popup prefix indicator
set -g @agents-popup home
set -g @agents-restart-key u
set -g @agents-next-window-key C-j
set -g @agents-previous-window-key C-k
run-shell "$HOME/personal/tmux-agents-go/agents.tmux"

set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
